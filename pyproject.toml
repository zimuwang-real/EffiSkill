[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "effiskill"
version = "1.0.0"
description = "EffiSkill: code-efficiency optimization with mined Operator Skills (EACL 2027 Findings)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zimu Wang"}, {name = "Yuling Shi"}, {name = "Mengfan Li"}, {name = "Zijun Liu"}, {name = "Jie M. Zhang"}, {name = "Chengcheng Wan"}, {name = "Xiaodong Gu"}]
dependencies = ["numpy>=1.23", "pandas>=2", "matplotlib>=3.7"]

[project.optional-dependencies]
pipeline = ["openai>=1.40", "PyYAML>=6", "scipy>=1.10", "scikit-learn>=1.3", "tqdm>=4.66"]
embeddings = ["sentence-transformers>=2.2"]
dev = ["pytest>=7"]
all = ["effiskill[pipeline,embeddings,dev]"]

[project.urls]
Paper = "https://arxiv.org/abs/2603.27850"
Code = "https://github.com/zimuwang-real/EffiSkill"

[project.scripts]
effiskill = "effiskill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["effiskill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
